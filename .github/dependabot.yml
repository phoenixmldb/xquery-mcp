# Keeps the PhoenixmlDb engine pin current.
#
# This repo was 26 releases behind before anyone noticed — the MCP server was answering
# questions with an engine from a different generation while the engine it names shipped fix
# after fix. scripts/check-pins.sh now fails the build when that happens; this opens the bump
# as a PR so it does not have to fail first.
#
# Scoped to PhoenixmlDb.* so the one update that matters is not buried in third-party churn.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: daily
    allow:
      - dependency-name: "PhoenixmlDb.*"
    groups:
      phoenixmldb-engines:
        patterns: ["PhoenixmlDb.*"]
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 5

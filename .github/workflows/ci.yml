name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # follow-engine-train.yml dispatches this on the tag it pushes: a tag pushed with GITHUB_TOKEN
  # triggers no workflow on its own.
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          # SDK 11 builds (global.json); the 8 and 10 runtimes run the older targets' tests.
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Determine version from git tags
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          BASE_VERSION="${LATEST_TAG#v}"
          COMMITS_SINCE=$(git rev-list --count "${LATEST_TAG}..HEAD" 2>/dev/null || git rev-list --count HEAD)
          if [ "$COMMITS_SINCE" = "0" ]; then
            VERSION="$BASE_VERSION"
          else
            VERSION="${BASE_VERSION}.${COMMITS_SINCE}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION} (tag: ${LATEST_TAG}, +${COMMITS_SINCE} commits)"

      - name: Engine pins are not stale
        run: ./scripts/check-pins.sh

      # Equality check, not a staleness check. check-pins.sh above catches a pin that has
      # fallen behind what is PUBLISHED; this catches one that has fallen behind the train
      # being released. This repo sat pinned at 1.6.14 through the entire 1.7.0 train with
      # nothing to say so. Fails closed: no train-locked pins is an error, not a pass.
      - name: Engine pin matches this release train
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/check-release-train.sh "${{ steps.version.outputs.version }}"

      - name: Build
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        # Build the tests too, with the same version. A test step that builds again without
        # -p:Version writes the csproj version over the server dll, and pack --no-build then
        # ships that dll: the 3.1.0 packages reported serverInfo.version 1.4.0.0 / 1.5.0.0.
        run: dotnet build tests/ -c Release -p:Version="$BUILD_VERSION"

      - name: Test
        run: dotnet test tests/ -c Release --no-build

      # publish-binaries runs only on a tag, so its command is exercised here first: a project
      # with two target frameworks cannot be published without -f (NETSDK1129).
      - name: Self-contained publish works (linux-x64)
        run: |
          dotnet publish src/ -c Release -f net10.0 -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish-check
          test -x ./publish-check/xquery-mcp-server

      # Tag-only, as in the engine repos. This previously packed and PUBLISHED on every push
      # to main, which is where the 4-part versions (1.4.0.3 = tag + 3 commits) came from: the
      # published history is a merge count, not a release history. A lockstep train cannot hold
      # if one member republishes itself two commits later.
      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/ -c Release --no-build -p:PackageVersion="$PKG_VERSION" -o ./artifacts

      - name: Packed server reports the release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/check-packed-version.sh artifacts "$PKG_VERSION"

      - name: Upload NuGet artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  # The same build and tests on SDK 10. global.json pins SDK 11; this job repoints it, so the
  # projects build net10.0 alone (Directory.Build.props adds net11.0 only on SDK 11). It proves
  # those builds need nothing from SDK 11, and that a host still on SDK 10 can build.
  build-sdk10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Select SDK 10
        run: |
          python3 - <<'PY'
          import json
          g = json.load(open("global.json"))
          g["sdk"] = {"version": "10.0.100", "rollForward": "latestFeature"}
          json.dump(g, open("global.json", "w"), indent=2)
          PY
          dotnet --version
          case "$(dotnet --version)" in 10.*) ;; *) echo "::error::expected SDK 10"; exit 1 ;; esac

      - name: Build
        run: |
          dotnet build tests/ -c Release

      - name: Test
        run: |
          dotnet test tests/ -c Release --no-build

  publish-nuget:
    needs: [build, build-sdk10]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - uses: actions/setup-dotnet@v4
        with:
          # SDK 11 builds (global.json); the 8 and 10 runtimes run the older targets' tests.
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Login to NuGet via trusted publisher
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: endpointsystems

      - name: Push to NuGet
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for pkg in ./artifacts/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  publish-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-sdk10]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - rid: linux-x64
            artifact: xquery-mcp-linux-x64
          - rid: linux-arm64
            artifact: xquery-mcp-linux-arm64
          - rid: osx-x64
            artifact: xquery-mcp-osx-x64
          - rid: osx-arm64
            artifact: xquery-mcp-osx-arm64
          - rid: win-x64
            artifact: xquery-mcp-win-x64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          # SDK 11 builds (global.json); the 8 and 10 runtimes run the older targets' tests.
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Determine version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION="${LATEST_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A self-contained binary carries its own runtime, so one target is enough: net10.0,
          # the LTS release. The tool package ships both net10.0 and net11.0.
          dotnet publish src/ -c Release -f net10.0 -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version="$BUILD_VERSION" \
            -o ./publish

      - name: Rename artifact
        run: |
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            mv ./publish/xquery-mcp-server.exe ./publish/${{ matrix.artifact }}
          else
            mv ./publish/xquery-mcp-server ./publish/${{ matrix.artifact }}
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/${{ matrix.artifact }}
